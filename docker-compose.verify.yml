# ============================================================
#  AIR 패치 검증용 throwaway 스택 (오케스트레이터 전용)
#   - 포트 8082, 컨테이너 airverify-*, 볼륨 airverify-data
#   - 패치된 워킹트리를 빌드 → 런타임 가드 OFF로 재공격 → 소스 자체 방어 검증
#   실행: docker compose -p airverify -f docker-compose.verify.yml up -d --build
# ============================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airverify-backend
    restart: "no"
    environment:
      - SPRING_APPLICATION_NAME=air-verify
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_TTL_MINUTES=${JWT_ACCESS_TTL_MINUTES:-60}
      - JWT_SUPER_ACCESS_TTL_HOURS=${JWT_SUPER_ACCESS_TTL_HOURS:-120}
      - JWT_REFRESH_TTL_HOURS=${JWT_REFRESH_TTL_HOURS:-168}
      - APP_BOOTSTRAP_ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - APP_BOOTSTRAP_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - APP_CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8082}
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/data/shop.db
    volumes:
      - airverify-data:/data
    ports:
      - "127.0.0.1:8082:8080"   # 검증은 로컬에서만
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  airverify-data:
    driver: local
