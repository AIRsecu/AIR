server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:./shop.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.shop.domain
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

jwt:
  access-secret: change-me-access-secret-min-32chars-padding
  refresh-secret: change-me-refresh-secret-min-32chars-padding
  access-ttl-minutes: 60
  super-access-ttl-hours: 120
  refresh-ttl-hours: 168

app:
  bootstrap-admin-username: admin
  bootstrap-admin-password: change-me-admin-password
  cors-origins: http://localhost:5173

logging:
  level:
    com.shop: DEBUG
    org.mybatis: DEBUG
