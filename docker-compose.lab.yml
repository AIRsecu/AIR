# ============================================================
#  AIR vuln-lab 격리 스택 (공개 데모와 분리)
#   - 포트 8081, 컨테이너 airlab-*, 볼륨 airlab-data, 네트워크 airlab-net
#   - 공개 데모(~/shoptest, 80포트/shop-*)와 동시 구동 가능
#   실행: docker compose -p airlab -f docker-compose.lab.yml up -d --build
#   접속: http://<host>:8081   (또는 EC2 내부 http://localhost:8081)
#   ※ vuln-lab: 의도적 취약점 포함 — 신뢰 IP에서만 8081 개방
# ============================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airlab-backend
    restart: unless-stopped
    environment:
      - SPRING_APPLICATION_NAME=air-lab
      # 강한 시크릿 필수(fail-closed) — .env 에 설정
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_TTL_MINUTES=${JWT_ACCESS_TTL_MINUTES:-60}
      - JWT_SUPER_ACCESS_TTL_HOURS=${JWT_SUPER_ACCESS_TTL_HOURS:-120}
      - JWT_REFRESH_TTL_HOURS=${JWT_REFRESH_TTL_HOURS:-168}
      - APP_BOOTSTRAP_ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - APP_BOOTSTRAP_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - APP_CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8081}
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/data/shop.db
      # [IR] Discord 웹훅 — 실제 URL 은 .env 에만(커밋 금지). 미설정 시 no-op.
      - AIR_DISCORD_WEBHOOK=${AIR_DISCORD_WEBHOOK:-}
      # [IR 유입] ir-automation 서비스(FastAPI /ingest)로 앱→IR 인시던트 전달.
      #   기본값 = 같은 compose 네트워크의 ir-automation:8090. 끄려면 .env 에 빈값 지정.
      - AIR_IR_INGEST_URL=${AIR_IR_INGEST_URL:-http://ir-automation:8090/ingest}
    volumes:
      - airlab-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - airlab-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airlab-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - airlab-net

  # [IR] IR 자동대응 서비스 — 앱→IR 유입(/ingest) → TTL IP차단·Discord·reconcile.
  #   같은 airlab-net 이라 backend 가 http://ir-automation:8090 으로 도달.
  #   forward 는 best-effort(앱은 IR 미가동이어도 정상) → backend depends_on 강제 안 함.
  #   포트는 loopback(127.0.0.1)만 노출 — 외부 비공개(관측/디버그는 호스트에서만).
  ir-automation:
    build:
      context: ./ir-automation
      dockerfile: Dockerfile
    container_name: airlab-ir
    restart: unless-stopped
    environment:
      - BLOCK_MODE=simulation
      - DISCORD_WEBHOOK_URL=${AIR_DISCORD_WEBHOOK:-}
      - RECONCILE_INTERVAL_SECONDS=30
      - SERVICE_TIMEZONE=Asia/Seoul
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - airlab-net

volumes:
  airlab-data:
    driver: local

networks:
  airlab-net:
    driver: bridge
