[project]
name = "air"
version = "0.1.0"
description = ""
authors = [
    {name = "JHyye",email = "jjihye.park@gmail.com"}
]
package-mode = false
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "uvicorn (>=0.49.0,<0.50.0)",
    "fastapi (>=0.138.1,<0.139.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.optional-dependencies]
# aws_waf 차단 모드에서만 필요(기본 simulation 은 불필요): pip install '.[waf]'
waf = [
    "boto3 (>=1.35.0,<2.0.0)"
]

[dependency-groups]
dev = [
    "semgrep (>=1.168.0,<2.0.0)",
    "pytest (>=8.3.0,<9.0.0)",
    "httpx (>=0.27.0,<1.0.0)"
]
