# ============================================================
#  프론트엔드 nginx - 정적 서빙 + API 리버스 프록시
#   /        → 정적 SPA (index.html)
#   /api/    → 백엔드 컨테이너(backend:8080)로 프록시 (동일 출처)
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 보안 응답 헤더 (클릭재킹/MIME스니핑/참조자/CSP 방어계층) ──
    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # 정적 파일 (SPA: 해시 라우팅이라 / 로 항상 index 반환)
    #  테스트베드 - 항상 최신 파일을 받도록 캐시 비활성
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options        "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # 실시간 알림 SSE → 버퍼링 끄고 긴 타임아웃(이벤트 스트림 유지)
    #  (prefix 가 /api/ 보다 길어 이 블록이 우선 매칭됨)
    location /api/v1/notifications/stream {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";       # keep-alive 유지
        proxy_buffering    off;                       # 이벤트 즉시 전달
        proxy_cache        off;
        proxy_read_timeout 3600s;                     # SSE 장기 연결
        add_header X-Accel-Buffering "no" always;     # 프록시 버퍼링 비활성 힌트
    }

    # API → 백엔드(같은 docker 네트워크의 service 이름 'backend')
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 헬스(프론트 컨테이너 자체)
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
}
