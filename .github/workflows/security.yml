name: Security Pipeline

on:
  push:
    branches:
      - dev
      - feature/**
      - feat/**
      - main
      
  pull_request:
    branches:
      - dev
      - main

jobs:
  # ==========================================
  # 1. SAST 스캔
  # ==========================================
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 러너에 Semgrep 설치
      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Scan
        run: bash scripts/security/run-semgrep.sh

      - name: Upload Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: reports/semgrep/semgrep.json

  # ==========================================
  # 2. 컨테이너 및 의존성 스캔
  # ==========================================
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Report Directory
        run: mkdir -p reports/trivy

      - name: Run Trivy Scan
        run: bash scripts/security/run-trivy.sh

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: reports/trivy/

  # ==========================================
  # 3. DAST 스캔
  # ==========================================
  zap:
    runs-on: ubuntu-latest
    env:
      JWT_ACCESS_SECRET: ci-access-secret-32chars-minimum-padding-1234567890
      JWT_REFRESH_SECRET: ci-refresh-secret-32chars-minimum-padding-1234567890
      ADMIN_PASSWORD: ci-admin-password-1234!
      CORS_ORIGINS: http://localhost,http://127.0.0.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Create Report Directory
        run: |
          mkdir -p reports/zap
          chmod 777 reports/zap

      - name: Run ZAP Baseline Scan
        run: bash scripts/security/run-zap.sh
        continue-on-error: true    # 실패 시 workflow 실행(추후 false로 변경 필요)

      - name: Check ZAP alert severity
        if: always()    # 스캔 성공/실패와 관계없이 리포트 검증
        run: |
          jq '[.site[]?.alerts[]? | select(.riskcode !="0")] | length' \
          reports/zap/zap-report.json || echo "0"

      - name: Debug Report Files
        run: ls -al reports/zap

      - name: Fix ZAP Report Permissions
        run: sudo chown -R $USER:$USER reports/zap

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: reports/zap/zap-report.json
          if-no-files-found: error

  # ==========================================
  # 4. 결과 집계 및 보안 게이트
  # ==========================================
  summary:
    needs: [semgrep, trivy, zap]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 각 스캔 결과를 제 위치에 다운로드
      - name: Download Semgrep Report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-results
          path: reports/semgrep

      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-results
          path: reports/trivy
          
      - name: Download ZAP Report
        uses: actions/download-artifact@v4
        with:
          name: zap-report
          path: reports/zap

      - name: Generate Security Summary
        run: bash scripts/security/run-summary.sh

      - name: Extract Reports for LLM
        run: |
          python scripts/extract_semgrep.py
          python scripts/extract_trivy.py
          python scripts/extract_zap.py

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: integrated-security-reports
          path: |
            reports/summary/sec-summary.json
            reports/semgrep/semgrep_for_llm.json
            reports/trivy/trivy_for_llm.json
            reports/zap/zap_for_llm.json

      - name: Run Security Gate
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        run: python policy/security_gate.py