name: Security Pipeline

on:
  push:
    branches:
      - dev
      - feature/**
      - feat/**
      - main
      
  pull_request:
    branches:
      - dev
      - main

jobs:
  # ==========================================
  # 1. SAST 스캔
  # ==========================================
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Create Report Directory
        run: mkdir -p reports/semgrep

      # 러너에 Semgrep 설치
      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Scan
        run: bash scripts/security/run-semgrep.sh

      - name: Upload Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: reports/semgrep/semgrep.json
  # ==========================================
  # 2. CodeQL
  # ==========================================
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # GitHub Security 탭에 결과를 띄우기 위한 권한
      actions: read
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Java 빌드 환경 세팅 (Spring Boot 3.x / Java 21 기준)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Gradle이라면 'gradle'로 변경

      # 2. CodeQL 초기화 (Java와 JavaScript 동시 지정)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin, javascript-typescript
          # 기본 룰 외에 더 깊은 취약점을 찾기 위해 확장 룰 적용
          queries: security-extended,security-and-quality

      # 3. Java 코드 빌드
      - name: Build Java backend
        run: |
          # 백엔드 디렉토리로 이동하여 테스트를 제외하고 컴파일 수행
          cd backend
          mvn clean package -DskipTests

      # 4. CodeQL 분석 수행 및 SARIF 결과 파일 저장
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin,javascript-typescript"
          output: reports/codeql  # AI 파이프라인으로 넘겨줄 리포트 저장 폴더 지정

      # 5. 생성된 SARIF 리포트를 Artifact로 업로드
      - name: Upload CodeQL Results
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: reports/codeql/*.sarif

  # ==========================================
  # 3. 컨테이너 및 의존성 스캔
  # ==========================================
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Report Directory
        run: mkdir -p reports/trivy

      - name: Run Trivy Scan
        run: bash scripts/security/run-trivy.sh

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: reports/trivy/

  # ==========================================
  # 4. DAST 스캔
  # ==========================================
  zap:
    runs-on: ubuntu-latest
    env:
      JWT_ACCESS_SECRET: ${{ secrets.CI_JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.CI_JWT_REFRESH_SECRET }}
      ADMIN_PASSWORD: ${{ secrets.CI_ADMIN_PASSWORD }}
      CORS_ORIGINS: http://localhost,http://127.0.0.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Create Report Directory
        run: |
          mkdir -p reports/zap
          chmod 777 reports/zap

      - name: Run ZAP Baseline Scan
        run: bash scripts/security/run-zap.sh
        continue-on-error: true    # 실패 시 workflow 실행(추후 false로 변경 필요)

      - name: Check ZAP alert severity
        if: always()    # 스캔 성공/실패와 관계없이 리포트 검증
        run: |
          jq '[.site[]?.alerts[]? | select(.riskcode !="0")] | length' \
          reports/zap/zap-report.json || echo "0"

      - name: Debug Report Files
        run: ls -al reports/zap

      - name: Fix ZAP Report Permissions
        run: sudo chown -R $USER:$USER reports/zap

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: reports/zap/
          if-no-files-found: error

  # ==========================================
  # 5. schemathesis
  # ==========================================
  schemathesis:
    name: Schemathesis API Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start Backend
        env:
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: docker compose up -d

      - name: Wait Backend Health
        run: |
          timeout 120 bash -c '
            until curl -f http://localhost:8080/api/v1/health; do
              echo "Waiting for backend..."
              sleep 5
            done
          '

      - name: Show Backend Diagnostics
        if: failure()
        run: |
          echo "========== docker compose ps =========="
          docker compose ps

          echo ""
          echo "========== backend health =========="
          docker inspect shop-backend \
            --format='{{json .State.Health}}' || true

          echo ""
          echo "========== backend logs =========="
          docker compose logs backend --tail=200 || true

      - name: Install Schemathesis
        run: pip install schemathesis

      - name: Run Schemathesis
        continue-on-error: true
        run: |
          chmod +x scripts/security/run-schemathesis.sh
          ./scripts/security/run-schemathesis.sh

      - name: Upload Schemathesis Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report
          path: reports/openapi/

  # ==========================================
  # 4. 결과 집계 및 보안 게이트
  # ==========================================
  summary:
    needs: [semgrep, codeql, trivy, zap, schemathesis]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 1. 각 스캔 결과를 제 위치에 다운로드
      - name: Download Semgrep Report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-results
          path: reports/semgrep

      - name: Download CodeQL Report
        uses: actions/download-artifact@v4
        with:
          name: codeql-results
          path: reports/codeql

      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-results
          path: reports/trivy
          
      - name: Download ZAP Report
        uses: actions/download-artifact@v4
        with:
          name: zap-report
          path: reports/zap
      
      - name: Download Schemathesis Report
        uses: actions/download-artifact@v4
        with:
          name: schemathesis-report
          path: reports/openapi

      # 2. 기존 통계 Summary 생성
      - name: Generate Security Summary
        run: |
          mkdir -p reports/summary
          python scripts/generate_summary.py

      # 3. LLM 전용 데이터 경량화 스크립트 실행
      - name: Extract Reports for LLM
        run: |
          python scripts/extract_semgrep.py
          python scripts/extract_codeql.py
          python scripts/extract_trivy.py
          python scripts/extract_zap.py

      # 4. AI 에이전트 전용 독립 환경 구성 (scripts/ai_agent/requirements.txt 사용)
      - name: Install AI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/ai_agent/requirements.txt

      # 5. LangGraph AI 에이전트 파이프라인 실행
      - name: AI re-evaluation (provider seam)
        env:
          AIR_LLM_PROVIDER: ${{ vars.AIR_LLM_PROVIDER }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
        run: |
          pip install -r scripts/ai_agent/requirements.txt
          bash scripts/llm/run-ai.sh

      # 6. 생성된 AI 마크다운 리포트를 GitHub Summary에 출력
      - name: Publish AI Report to Job Summary
        run: |
          if [ -f reports/summary/ai_final_report.md ]; then
            cat reports/summary/ai_final_report.md >> $GITHUB_STEP_SUMMARY
          fi

      # 통합 리포트(스캔 + AI + 런타임 IR → 단일)
      - run: python reports/contract/aggregate.py
      - run: |
          [ -f reports/summary/unified_report.md ] && \
            cat reports/summary/unified_report.md >> "$GITHUB_STEP_SUMMARY" || true

      # 7. 아티팩트 업로드
      - name: Upload Integrated & AI Reports
        uses: actions/upload-artifact@v4
        with:
          name: integrated-security-reports
          path: |
            reports/summary/sec-summary.json
            reports/summary/ai_final_report.md
            reports/semgrep/semgrep_for_llm.json
            reports/codeql/codql_for_llm.json
            reports/trivy/trivy_for_llm.json
            reports/zap/zap_for_llm.json
            reports/openapi/schemathesis_for_llm.json

      # 8. Security Gate 통제 로직
      - name: Run Security Gate
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        run: python policy/security_gate.py