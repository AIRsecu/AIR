name: Security Pipeline

on:
  push:
    branches:
      - dev
      - feature/**
      - feat/**
      - main
      
  pull_request:
    branches:
      - dev
      - main

jobs:
  # ==========================================
  # 1. SAST 스캔
  # ==========================================
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Report Directory
        run: mkdir -p reports/semgrep

      # 러너에 Semgrep 설치
      - name: Install Semgrep
        run: pip install semgrep

      # 타겟(Spring, MyBatis, JWT, JS) 최적화 룰 및 노이즈 제거 옵션 적용
      - name: Run Semgrep Scan (Optimized for Java+JS)
        run: >
          semgrep scan 
          --config "p/java" 
          --config "p/jwt" 
          --config "p/javascript" 
          --config "p/owasp-top-ten" 
          --config "p/secrets"
          --exclude ".github/**" 
          --exclude "docs/**" 
          --exclude "frontend/css/**" 
          --exclude "**/*.sql" 
          --exclude "scripts/**" 
          --exclude "policy/**" 
          . 
          --json 
          --output reports/semgrep/semgrep.json || true

      - name: Upload Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: reports/semgrep/semgrep.json

  # ==========================================
  # 2. 컨테이너 및 의존성 스캔
  # ==========================================
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Report Directory
        run: mkdir -p reports/trivy

      - name: Build Docker Image
        run: docker build -t air-app:latest ./backend 

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: air-app:latest
          format: json
          output: reports/trivy/trivy.json
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: reports/trivy/trivy.json

  # ==========================================
  # 3. DAST 스캔
  # ==========================================
  zap:
    runs-on: ubuntu-latest
    env:
      JWT_ACCESS_SECRET: ci-access-secret-32chars-minimum-padding-1234567890
      JWT_REFRESH_SECRET: ci-refresh-secret-32chars-minimum-padding-1234567890
      ADMIN_PASSWORD: ci-admin-password-1234!
      CORS_ORIGINS: http://localhost,http://127.0.0.1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Application
        run: docker compose up -d

      - name: Wait for Application
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost/healthz; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      
      - name: Create Report Directory
        run: |
          mkdir -p reports/zap
          chmod 777 reports/zap

      - name: Run ZAP Baseline Scan
        run: |
          docker run --rm \
            --add-host=host.docker.internal:host-gateway \
            -v $(pwd)/reports/zap:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://host.docker.internal \
            -r zap-report.html \
            -J zap-report.json || true

      - name: Ensure ZAP Report Exists
        run: |
          if [ ! -f reports/zap/zap-report.json ]; then
            echo '{"site":[]}' > reports/zap/zap-report.json
          fi

      - name: Debug Report Files
        run: ls -al reports/zap

      - name: Fix ZAP Report Permissions
        run: sudo chown -R $USER:$USER reports/zap

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: reports/zap/zap-report.json
          if-no-files-found: error

  # ==========================================
  # 4. 결과 집계 및 보안 게이트
  # ==========================================
  summary:
    needs: [semgrep, trivy, zap]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 각 스캔 결과를 제 위치에 다운로드
      - name: Download Semgrep Report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-results
          path: reports/semgrep

      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-results
          path: reports/trivy
          
      - name: Download ZAP Report
        uses: actions/download-artifact@v4
        with:
          name: zap-report
          path: reports/zap

      - name: Verify ZAP Report
        run: |
          test -f reports/zap/zap-report.json

      - name: Debug Downloaded Files
        run: |
          echo "[*] Checking downloaded reports structure:"
          ls -R reports/

      - name: Generate Security Summary
        run: |
          mkdir -p reports/summary
          python scripts/generate_summary.py

      - name: Extract Reports for LLM
        run: |
          python scripts/extract_semgrep.py
          python scripts/extract_trivy.py
          python scripts/extract_zap.py

      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: integrated-security-reports
          path: |
            reports/summary/sec-summary.json
            reports/semgrep/semgrep_for_llm.json
            reports/trivy/trivy_for_llm.json
            reports/zap/zap_for_llm.json

      - name: Run Security Gate
        continue-on-error: ${{ github.ref != 'refs/heads/main' }}
        run: python policy/security_gate.py