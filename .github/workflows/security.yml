name: Security Pipeline

on:
  push:
    branches:
      - dev
      - feature/**

  pull_request:
    branches:
      - dev
      - main

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Install Semgrep
        run: poetry add --group dev semgrep

      - name: Create Report Directory
        run: mkdir -p reports/semgrep

      - name: Run Semgrep Scan
        run: |
          mkdir -p reports
          poetry run semgrep scan \
            --config auto \
            . \
            --error \
            --json \
            --output reports/semgrep/semgrep.json

      - name: Upload Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: reports/semgrep/semgrep.json

  trivy:
    needs: semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Report Directory
        run: mkdir -p reports/trivy

      - name: Build Docker Image
        run: docker build -t air-app:latest .

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: air-app:latest
          format: json
          output: reports/trivy/trivy.json
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: reports/trivy/trivy.json
  
  summary:
    needs: [semgrep, trivy]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Download Semgrep Report
        uses: actions/download-artifact@v4
        with:
          name: semgrep-results
          path: reports/semgrep

      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-results
          path: reports/trivy

      - name: Debug Reports
        run: |
          ls -R reports

      - name: Generate Security Summary
        run: |
          mkdir -p reports/summary
          poetry run python scripts/generate_summary.py

      - name: Upload Summary Report
        uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: reports/summary/sec-summary.json

      - name: Run Security Gate
        run: |
          poetry run python policy/security_gate.py
  
  