# IR 자동대응 단위테스트 — 신규 additive 워크플로(방식 B).
#   security.yml(JHyye 소유) 무수정. ir-automation/ 변경 시에만 실행.
name: IR Automation Tests

on:
  push:
    branches: [dev, main, "feat/**", "feature/**"]
    paths:
      - "ir-automation/**"
      - ".github/workflows/ir-tests.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "ir-automation/**"
      - ".github/workflows/ir-tests.yml"

jobs:
  ir-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # httpx: test_pipeline.py 의 fastapi.testclient.TestClient 에 필수(없으면 수집 실패)
          # tzdata: risk.py/stats.py 의 ZoneInfo("Asia/Seoul") 보장
          pip install fastapi pydantic uvicorn requests python-dotenv tzdata pytest httpx

      - name: Run IR test suite
        env:
          PYTHONPATH: ir-automation   # conftest 의 config.settings / ir.* import 해결
        run: pytest ir-automation/tests -q
